*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;

.app{max-width:600px;margin:0 auto;padding:12px 12px 100px}

.sel-bar{display:none;align-items:center;padding:8px 12px;

.sel-bar.on{display:flex}
.sel-bar .count{font-size:13px;color:#00d2a0;white-space:nowrap}

.sel-bar .clear:active{background:#333}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;
  padding:10px 12px;border-top:1px solid #333;z-index:10}
.bottom-inner{max-width:600px;margin:0 auto}
.cart-btn{width:100%;padding:14px;font-size:18px;background:#00d2a0;
  color:#1a1a2e;border:none;border-radius:12px;font-weight:700;
  cursor:pointer;transition:background .2s}
.cart-btn:active{background:#00e6b0}
.cart-btn:disabled{background:#444;color:#888}
.result{margin-top:6px;text-align:center}
.result a{display:inline-block;padding:10px 20px;background:#00d2a0;
  color:#1a1a2e;border-radius:10px;text-decoration:none;font-weight:700;font-size:15px;margin:4px}
.result .err{color:#ff6b6b;font-size:13px;padding:8px}
.spin{display:none;color:#888;font-size:13px;padding:8px}
.spin.on{display:block}
</style>

<script>
(function(){
"use strict";
var selected = {};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Find best product match for a query
function findBest(query){
  var q=query.toLowerCase().trim();
  if(!q)return null;
  
  // Stage 1: alias exact match
  if(DATA.aliases&&DATA.aliases[q]&&DATA.aliases[q].length){
    var xid=''+DATA.aliases[q][0];
    var p=DATA.products[xid];
    if(p)return {id:xid, name:p.name, stage:'alias'};
  }
  
  // Stage 2: substring match — pick shortest name (most specific)
  var matches=[];
  for(var xid in DATA.products){
    var p=DATA.products[xid];
    if(p.name.toLowerCase().indexOf(q)!==-1)matches.push({id:xid, name:p.name});
  }
  if(matches.length===1)return {id:matches[0].id, name:matches[0].name, stage:'substr'};
  if(matches.length>1){
    matches.sort(function(a,b){return a.name.length-b.name.length;});
    return {id:matches[0].id, name:matches[0].name, stage:'substr'};
  }
  
  // Stage 3: word-prefix match
  for(var xid in DATA.products){
    var words=DATA.products[xid].name.toLowerCase().split(/[\s,()«»"'.\-/]+/);
    for(var i=0;i<words.length;i++){
      if(words[i]&&words[i].indexOf(q)===0){
        return {id:xid, name:DATA.products[xid].name, stage:'word'};
      }
    }
  }
  
  return null;
}

function updateUI(){
  var keys=Object.keys(selected);
  var c=keys.length;
  var bar=document.getElementById('selBar');
  var cnt=document.getElementById('selCount');
  var btn=document.getElementById('cartBtn');
  if(c){
    bar.classList.add('on');
    cnt.textContent=c+' '+((c%10===1&&c%100!==11)?'товар':(c%10>=2&&c%10<=4&&(c%100<10||c%100>=20))?'товара':'товаров');
    btn.disabled=false;
    btn.textContent='Собрать корзину ('+c+') →';
  }else{
    bar.classList.remove('on');
    btn.disabled=true;
    btn.textContent='Собрать корзину →';
  }
}

// Enter → auto-select best match
document.getElementById('search').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  e.preventDefault();
  var q=this.value.trim();
  if(!q)return;
  var m=findBest(q);
  var s=this;
  if(m){
    if(!selected[m.id])selected[m.id]=1;
    updateUI();
    s.placeholder='\u2713 '+m.name;
  }else{
    s.placeholder='\u2717 Не найдено: '+q;
  }
  this.value='';
  setTimeout(function(){s.placeholder='Поиск по товарам...';},2500);
  this.blur();
});

document.getElementById('clearSel').addEventListener('click',function(){
  selected={};
  document.getElementById('search').value='';
  updateUI();
});

var MCP_URL='https://mcp001.vkusvill.ru/mcp';
function mcpCall(tool,args,cb){
  var xhr=new XMLHttpRequest();
  xhr.open('POST',MCP_URL,true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('Accept','application/json, text/event-stream');
  xhr.timeout=15000;
  xhr.onload=function(){cb(null,xhr.responseText);};
  xhr.onerror=function(){cb('Нет связи с сервером');};
  xhr.ontimeout=function(){cb('Сервер не отвечает');};
  xhr.send(JSON.stringify({jsonrpc:'2.0',id:Date.now(),method:'tools/call',
    params:{name:tool,arguments:args}}));
}
function parseCartLink(raw){
  try{
    var d=JSON.parse(raw);
    var content=d.result&&d.result.content;
    if(content&&content[0]&&content[0].text){
      var inner=JSON.parse(content[0].text);
      if(inner.ok&&inner.data&&inner.data.link)return inner.data.link;
      if(inner.link)return inner.link;
      if(inner.url)return inner.url;
    }
    if(d.error)throw new Error(d.error.message||'MCP error '+d.error.code);
    return null;
  }catch(e){throw e;}
}
document.getElementById('cartBtn').addEventListener('click',function(){
  var prods=[];
  for(var xid in selected){
    prods.push({xml_id:parseInt(xid),q:selected[xid]});
  }
  if(!prods.length)return;
  var btn=document.getElementById('cartBtn');
  var spin=document.getElementById('spin');
  var res=document.getElementById('result');
  btn.disabled=true;spin.classList.add('on');res.innerHTML='';
  mcpCall('vkusvill_cart_link_create',{products:prods},function(err,raw){
    spin.classList.remove('on');btn.disabled=false;
    if(err){res.innerHTML='<div class="err">'+esc(err)+'</div>';return;}
    try{
      var url=parseCartLink(raw);
      if(url){
        res.innerHTML='<a href="'+url+'" target="_blank" rel="noopener">🛍 Открыть корзину ('+prods.length+' тов.) →</a>';
        if(navigator.clipboard)navigator.clipboard.writeText(url).catch(function(){});
      }else{
        res.innerHTML='<div class="err">Не удалось создать корзину</div>';
      }
    }catch(e){res.innerHTML='<div class="err">Ошибка: '+esc(e.message||String(e))+'</div>';}
  });
});

updateUI();
})();
</script>
